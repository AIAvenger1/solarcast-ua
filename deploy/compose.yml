# SolarCast UA on a single cloud VM (Hetzner Cloud, Ubuntu, Docker).
# Caddy terminates HTTPS (certificates are issued automatically) and is the only
# container reachable from the internet; the app listens on the internal network.
services:
  solarcast:
    build: .
    image: solarcast-ua:latest
    container_name: solarcast-ua
    restart: unless-stopped
    env_file: .env                 # ANTHROPIC_API_KEY and the daily call caps
    environment:
      # Only Caddy can reach this container, so its X-Forwarded-For is trusted:
      # the per-client limits then see the real visitor address.
      FORWARDED_ALLOW_IPS: "*"
    expose: ["8080"]
    read_only: true                # the service keeps no state on disk
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 300m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    container_name: solarcast-caddy
    restart: unless-stopped
    depends_on: [solarcast]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS, e.g. solarcast.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # issued certificates survive restarts
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 200m

volumes:
  caddy_data:
  caddy_config:
